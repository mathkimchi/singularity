# Which portal backends xdg-desktop-portal uses in Sonamu (`XDG_CURRENT_DESKTOP=sonamu`).
# Copy to ~/.config/xdg-desktop-portal/sonamu-portals.conf
# (NixOS: `xdg.portal.config.sonamu`, with `xdg.portal.extraPortals = [ pkgs.xdg-desktop-portal-wlr pkgs.xdg-desktop-portal-gtk ];`).
#
# Screen sharing and screenshots (eg OBS, browsers) go through xdg-desktop-portal-wlr (0.8+),
# which captures with ext-image-copy-capture.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
