[workspace]
members = [
    "singularity_ui",
    "singularity_sap",

    "singularity_common",
    "singularity_common/singularity_macros",

    "singularity_sporg",
    "singularity_sde",
    "singularity_sttk",
    "singularity_standard_tabs", "dynamic_plugin_sandbox/server", "dynamic_plugin_sandbox/client",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
uuid = { version = "^1.10.0", features = ["v4", "serde"] }
paste = { version = "1" }


