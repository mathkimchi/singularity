[workspace]
members = [
    "singularity_ui",
    "singularity_sap",

    "singularity_common",
    "singularity_common/singularity_macros",

    "singularity_sporg",
    "singularity_sde",
    "singularity_standard_tabs",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
uuid = { version = "^1.10.0", features = ["v4", "serde"] }

